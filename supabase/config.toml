verify_jwt = false

[functions.payment-card]
verify_jwt = false

[functions.oauth-exchange]
verify_jwt = false

[functions.ga4-metrics]
verify_jwt = false

[functions.gads-metrics]
verify_jwt = false

[functions.meta-ads-metrics]
