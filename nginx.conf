server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca cacheado — garante que o browser sempre busca a versão atual
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Assets com hash no nome (JS/CSS do Vite) — cache de 1 ano
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — todas as rotas servem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
